<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loupe — Pixel-Perfect UI Inspection</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: white;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      text-align: center;
    }
    main { padding: 32px; }
    h1 { font-size: 44px; margin: 0 0 8px; }
    p { margin: 0 0 28px; opacity: 0.92; }
    a {
      color: white;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 8px;
      padding: 10px 18px;
      margin: 0 6px;
      text-decoration: none;
      display: inline-block;
    }
    a:hover { background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <main>
    <h1>Loupe</h1>
    <p>Pixel-perfect UI inspection, measuring &amp; Figma diffing — as a Chrome extension.</p>
    <nav>
      <a href="https://github.com/contactashpat/loupe">GitHub</a>
      <a href="/loupe/privacy/">Privacy Policy</a>
    </nav>
  </main>
</body>
</html>
